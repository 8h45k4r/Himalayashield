# One build, two targets (docs/RELEASE.md). The cron keeps live data fresh;
# a failed fetch ships the OFFLINE page rather than stale data.
name: Deploy

on:
  push:
    branches: [claude/github-token-carbon-setup-oynwnp, main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Tests, including the failure path (Gate 3)
        run: python3 -m unittest discover -s tools -v
      - name: Build site (live fetch; OFFLINE page on fetch failure)
        run: python3 tools/build_site.py --out _site
      - name: Enforce the Tier 2 budget on the shipped artifact (Gate 1)
        run: |
          set -e
          size=$(wc -c < _site/index.html)
          [ "$size" -le 51200 ] || { echo "over budget: ${size} bytes"; exit 1; }
          if grep -Eiq '<(script|link|img)[^>]+(src|href)="https?://' _site/index.html; then
            echo "external resource found in shipped page"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  # Publishing a gh-pages branch avoids the Pages settings API entirely
  # (creating the Pages site via API needs admin rights the workflow token
  # lacks); GitHub auto-enables Pages for a gh-pages branch. The branch is
  # a disposable artifact the workflow owns — force-push is intentional.
  publish-pages-branch:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Publish _site to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd _site
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish site $(date -u +%FT%TZ) from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # secrets aren't readable in `if:` expressions; route through env
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Deploy to himalayashield.allgetz.com
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy
      - name: Cloudflare not configured yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN secret not set — see docs/RELEASE.md; skipping."
