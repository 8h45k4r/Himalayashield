# Gate 5: static analysis on every PR, every push to default, and weekly.
name: CodeQL

on:
  push:
    branches: [claude/github-token-carbon-setup-oynwnp, main]
  pull_request:
  schedule:
    - cron: "30 2 * * 1"

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
